/* ---------- Tema MUI a partir de la marca ---------- */
const DARK_INK = '#1E1B2E';
const bestInk = c => (getContrastRatio(c, '#FFFFFF') >= getContrastRatio(c, DARK_INK) ? '#FFFFFF' : DARK_INK);
function buildTheme(cfg, sysDark) {
  const mode = cfg.mode === 'system' ? (sysDark ? 'dark' : 'light') : cfg.mode;
  const dark = mode === 'dark';
  const p = cfg.primary, s = cfg.secondary;
  const solid = cfg.buttonStyle === 'solid';
  const pMain = solid ? darken(p, 0.42) : p;
  const pInk = solid ? bestInk(pMain) : darken(p, 0.72);
  const strong = dark ? lighten(p, 0.25) : darken(p, 0.58);
  const compact = cfg.density === 'compacta';
  const r = Number(cfg.radius);
  return createTheme({
    palette: {
      mode,
      primary: { main: pMain, contrastText: pInk, light: lighten(p, 0.6), dark: darken(pMain, 0.08) },
      secondary: { main: s, contrastText: darken(s, 0.72) },
      background: dark ? { default: '#17151E', paper: '#211E2A' } : { default: lighten(p, 0.9), paper: '#FFFFFF' },
      text: dark ? { primary: '#ECE9F5', secondary: '#ADA8BE' } : { primary: '#26232F', secondary: '#615B70' },
      divider: dark ? 'rgba(236,233,245,.10)' : 'rgba(38,35,47,.10)',
      success: { main: dark ? '#81C995' : '#2E7D4F' }, warning: { main: dark ? '#F2C46D' : '#9A6A00' }, error: { main: dark ? '#F28B95' : '#B3261E' }
    },
    shape: { borderRadius: r },
    brand: { strong, primary: p, secondary: s, appbar: cfg.appbar, appInk: bestInk(cfg.appbar) },
    typography: {
      fontFamily: `"${cfg.font}", system-ui, -apple-system, "Segoe UI", sans-serif`,
      h4: { fontWeight: 800, letterSpacing: '-.01em' }, h5: { fontWeight: 800 }, h6: { fontWeight: 700 },
      subtitle2: { fontWeight: 700 }, button: { textTransform: 'none', fontWeight: 700, letterSpacing: '.01em' },
      overline: { fontWeight: 700, letterSpacing: '.1em' }
    },
    components: {
      MuiCssBaseline: { styleOverrides: { body: { backgroundColor: dark ? '#17151E' : lighten(p, 0.9) } } },
      MuiButton: {
        defaultProps: { disableElevation: true, size: compact ? 'small' : 'medium' },
        styleOverrides: {
          root: { borderRadius: Math.max(r, 8), paddingInline: 16 },
          textPrimary: { color: strong }, outlinedPrimary: { color: strong, borderColor: alpha(strong, 0.35) },
          containedSecondary: { color: darken(s, 0.72) }
        }
      },
      MuiPaper: { styleOverrides: { root: { backgroundImage: 'none' } } },
      MuiCard: { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: `1px solid ${dark ? 'rgba(236,233,245,.10)' : 'rgba(38,35,47,.09)'}`, borderRadius: r + 2 } } },
      MuiTextField: { defaultProps: { size: compact ? 'small' : 'medium', fullWidth: true } },
      MuiTable: { defaultProps: { size: compact ? 'small' : 'medium' } },
      MuiTableCell: { styleOverrides: { head: { fontWeight: 700, color: dark ? '#ADA8BE' : '#615B70', whiteSpace: 'nowrap' } } },
      MuiChip: { styleOverrides: { root: { fontWeight: 700, borderRadius: Math.max(r - 4, 6) } } },
      MuiTab: { styleOverrides: { root: { textTransform: 'none', fontWeight: 700, minHeight: 44, '&.Mui-selected': { color: strong } } } },
      MuiTabs: { styleOverrides: { indicator: { backgroundColor: strong, height: 3, borderRadius: 3 } } },
      MuiDialog: { styleOverrides: { paper: { borderRadius: r + 4 } } },
      MuiListItemButton: { styleOverrides: { root: { borderRadius: Math.max(r - 2, 6) } } },
      MuiToggleButton: { styleOverrides: { root: { textTransform: 'none', fontWeight: 700, '&.Mui-selected': { backgroundColor: alpha(p, dark ? .3 : .45), color: strong } } } },
      MuiStepIcon: { styleOverrides: { root: { '&.Mui-active, &.Mui-completed': { color: dark ? p : darken(p, 0.25) } } } }
    }
  });
}

function useSysDark() {
  const get = () => {
    const t = document.documentElement.dataset.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  };
  const [d, setD] = useState(get);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const f = () => setD(get());
    mq.addEventListener && mq.addEventListener('change', f);
    const mo = new MutationObserver(f);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => { mq.removeEventListener && mq.removeEventListener('change', f); mo.disconnect(); };
  }, []);
  return d;
}

const I = ({ n, fill, sx, ...p }) => <Icon baseClassName="material-symbols-rounded" className={fill ? 'fill' : undefined} sx={{ fontSize: 22, ...sx }} {...p}>{n}</Icon>;
function soft(c, t) { return t.palette.mode === 'dark' ? alpha(c, 0.22) : c; }
function inkOn(c, t) { return t.palette.mode === 'dark' ? lighten(c, 0.35) : darken(c, 0.68); }

function StatusChip({ s, size = 'small' }) {
  const t = useTheme();
  const c = ST[s] || '#E3DEEE';
  return <Chip size={size} label={s} sx={{ bgcolor: soft(c, t), color: inkOn(c, t) }} />;
}
function BrandMark({ cfg, size = 36 }) {
  const t = useTheme();
  if (cfg.logo) return <Avatar src={cfg.logo} variant="rounded" sx={{ width: size, height: size, bgcolor: 'transparent', borderRadius: 2 }} />;
  return <Avatar variant="rounded" sx={{ width: size, height: size, bgcolor: cfg.primary, color: darken(cfg.primary, .7), borderRadius: Math.max(Number(cfg.radius) - 4, 6) + 'px' }}><I n={cfg.icon} fill sx={{ fontSize: size * .6 }} /></Avatar>;
}
function PageHead({ title, sub, action, eyebrow }) {
  return (
    <Stack direction={{ xs: 'column', sm: 'row' }} spacing={2} alignItems={{ xs: 'flex-start', sm: 'flex-end' }} justifyContent="space-between" sx={{ mb: 3 }}>
      <Box sx={{ minWidth: 0 }}>
        {eyebrow && <Typography variant="overline" color="text.secondary">{eyebrow}</Typography>}
        <Typography variant="h4" component="h1" sx={{ fontSize: { xs: 26, md: 32 }, textWrap: 'balance' }}>{title}</Typography>
        {sub && <Typography color="text.secondary" sx={{ mt: .5, maxWidth: 720 }}>{sub}</Typography>}
      </Box>
      {action && <Box sx={{ flexShrink: 0 }}>{action}</Box>}
    </Stack>
  );
}
function Kpi({ icon, label, value, hint, color, onClick }) {
  const t = useTheme();
  return (
    <Card sx={{ height: '100%', cursor: onClick ? 'pointer' : 'default', transition: 'transform .15s', '&:hover': onClick ? { transform: 'translateY(-2px)' } : {} }} onClick={onClick}>
      <CardContent sx={{ display: 'flex', gap: 2, alignItems: 'center' }}>
        <Avatar variant="rounded" sx={{ bgcolor: soft(color, t), color: inkOn(color, t), width: 50, height: 50, borderRadius: 3 }}><I n={icon} /></Avatar>
        <Box sx={{ minWidth: 0 }}>
          <Typography variant="h5" className="num" sx={{ lineHeight: 1.15 }}>{value}</Typography>
          <Typography variant="body2" color="text.secondary" fontWeight={600}>{label}</Typography>
          {hint && <Typography variant="caption" color="text.secondary">{hint}</Typography>}
        </Box>
      </CardContent>
    </Card>
  );
}
function Timeline({ items }) {
  const t = useTheme();
  return (
    <Box>
      {items.map((x, i) => {
        const c = ST[x.state] || '#E3DEEE';
        return (
          <Box key={i} sx={{ display: 'flex', gap: 1.5 }}>
            <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', pt: .6 }}>
              <Box sx={{ width: 14, height: 14, borderRadius: '50%', bgcolor: soft(c, t), border: '2px solid', borderColor: inkOn(c, t) }} />
              {i < items.length - 1 && <Box sx={{ flex: 1, width: 2, bgcolor: 'divider', my: .5 }} />}
            </Box>
            <Box sx={{ pb: 2, minWidth: 0 }}>
              <Typography variant="body2" fontWeight={800}>{x.state}</Typography>
              <Typography variant="caption" color="text.secondary">{x.at} · {x.by}</Typography>
              {x.reason && <Typography variant="body2" sx={{ mt: .75, px: 1.5, py: 1, bgcolor: 'action.hover', borderRadius: 1.5 }}>{x.reason}</Typography>}
            </Box>
          </Box>
        );
      })}
    </Box>
  );
}
function FileButton({ label, accept, onFile, icon = 'upload', variant = 'outlined', size }) {
  return (
    <Button variant={variant} size={size} component="label" startIcon={<I n={icon} />}>
      {label}
      <input hidden type="file" accept={accept} onChange={e => { const f = e.target.files && e.target.files[0]; if (f) onFile(f); e.target.value = ''; }} />
    </Button>
  );
}
function Empty({ icon, title, text }) {
  return (
    <Box sx={{ textAlign: 'center', py: 6, px: 2 }}>
      <I n={icon} sx={{ fontSize: 44, color: 'text.secondary' }} />
      <Typography variant="subtitle1" fontWeight={800} sx={{ mt: 1 }}>{title}</Typography>
      <Typography variant="body2" color="text.secondary">{text}</Typography>
    </Box>
  );
}

const REASONS_ADJ = ['Falta número de orden de compra', 'Valor no coincide con lo pactado', 'Datos del receptor incompletos', 'Falta anexo o soporte', 'Otro'];
const REASONS_REJ = ['Receptor incorrecto', 'Factura duplicada', 'Servicio o bien no recibido', 'Proveedor sin contrato vigente', 'Otro'];
function ReasonDialog({ open, title, catalog, confirm, color = 'primary', onClose, onSubmit }) {
  const [m, setM] = useState('');
  const [d, setD] = useState('');
  useEffect(() => { if (open) { setM(''); setD(''); } }, [open]);
  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="xs">
      <DialogTitle fontWeight={800}>{title}</DialogTitle>
      <DialogContent>
        <Alert severity="info" icon={<I n="mark_email_unread" />} sx={{ mb: 2 }}>El motivo es obligatorio y se notificará al proveedor (RN-04).</Alert>
        <TextField id="reason-cat" select label="Motivo" value={m} onChange={e => setM(e.target.value)} sx={{ mb: 2 }}>
          {catalog.map(x => <MenuItem key={x} value={x}>{x}</MenuItem>)}
        </TextField>
        <TextField id="reason-detail" label="Detalle para el proveedor" multiline minRows={3} value={d} onChange={e => setD(e.target.value)} />
      </DialogContent>
      <DialogActions sx={{ px: 3, pb: 2 }}>

}

/* ---------- Configuración (marca, textos, parámetros) ---------- */
function ColorField({ id, label, value, onChange, extra = [] }) {
  const t = useTheme();
  const [txt, setTxt] = useState(value);
  useEffect(() => { setTxt(value); }, [value]);
  const valid = /^#[0-9a-fA-F]{6}$/.test(txt);
  return (
    <Box>
      <Typography variant="body2" fontWeight={700} sx={{ mb: 1 }}>{label}</Typography>
      <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap alignItems="center">
        {[...extra, ...PASTELS].map(p => (
          <Tooltip key={p.c} title={p.n}>
            <Box component="button" type="button" aria-label={p.n} onClick={() => onChange(p.c)} sx={{ width: 32, height: 32, borderRadius: '50%', bgcolor: p.c, cursor: 'pointer', border: '2px solid', borderColor: value.toLowerCase() === p.c.toLowerCase() ? t.brand.strong : 'divider', outline: value.toLowerCase() === p.c.toLowerCase() ? `3px solid ${alpha(t.brand.strong, .25)}` : 'none', p: 0 }} />
          </Tooltip>
        ))}
        <Box component="label" sx={{ position: 'relative', width: 32, height: 32, borderRadius: '50%', border: '2px dashed', borderColor: 'divider', display: 'grid', placeItems: 'center', cursor: 'pointer' }}>
          <I n="colorize" sx={{ fontSize: 18 }} />
          <input aria-label={'Color personalizado ' + label} type="color" value={valid ? value : '#ffffff'} onChange={e => onChange(e.target.value.toUpperCase())} style={{ position: 'absolute', inset: 0, opacity: 0, cursor: 'pointer' }} />
        </Box>
        <TextField id={id} size="small" value={txt} fullWidth={false} onChange={e => { const v = e.target.value.trim(); setTxt(v); if (/^#[0-9a-fA-F]{6}$/.test(v)) onChange(v.toUpperCase()); }} error={!valid} helperText={valid ? '' : 'Use #RRGGBB'} sx={{ width: 130 }} inputProps={{ className: 'num', maxLength: 7 }} />
      </Stack>
    </Box>
  );
}
function ContrastNote({ bg, fg, label }) {
  const r = getContrastRatio(bg, fg);
  const ok = r >= 4.5;
  return <Chip size="small" icon={<I n={ok ? 'check_circle' : 'warning'} sx={{ fontSize: 18 }} />} color={ok ? 'success' : 'warning'} variant="outlined" label={`${label}: ${r.toFixed(1)}:1 ${ok ? '· cumple AA' : '· no cumple AA'}`} />;
}

function blockReason(ctx) {
  const sup = ctx.db.suppliers.find(s => s.id === ME);
  if (sup.status === 'Bloqueado') return 'Su cuenta está bloqueada por la empresa. Puede consultar y descargar, pero no radicar.';
  if (ctx.cfg.params.blockOnExpired) {
    const exp = ctx.db.docs.filter(d => d.required && docState(d) === 'Vencido');
    if (exp.length) return 'Tiene documentos obligatorios vencidos: ' + exp.map(d => d.name).join(', ') + '. Renuévelos para radicar.';
  }
  return null;
}

function parseUBL(text) {
  try {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    const one = (root, tag) => { const el = (root || doc).getElementsByTagNameNS('*', tag); return el.length ? el[0].textContent.trim() : ''; };
    const sup = doc.getElementsByTagNameNS('*', 'AccountingSupplierParty')[0];
    const cus = doc.getElementsByTagNameNS('*', 'AccountingCustomerParty')[0];
    const total = Number(one(null, 'PayableAmount')) || 0;
    const sub = Number(one(null, 'LineExtensionAmount')) || Math.round(total / 1.19);
    const r = { number: one(null, 'ID'), date: one(null, 'IssueDate'), nitE: onlyDigits(one(sup, 'CompanyID')), nitR: onlyDigits(one(cus, 'CompanyID')), subtotal: sub, iva: total - sub, total, cufe: one(null, 'UUID').slice(0, 14) + '…', po: '' };
    return r.number ? r : null;
  } catch (e) { return null; }
}
function ProvRadicar({ ctx }) {
  const { db, cfg, act } = ctx;
  const [step, setStep] = useState(0);
  const [files, setFiles] = useState({ xml: '', pdf: '' });
  const [data, setData] = useState(null);
  const [done, setDone] = useState(null);
  const block = blockReason(ctx);
  const dup = data && db.invoices.find(i => i.sid === ME && i.number.trim().toUpperCase() === String(data.number).trim().toUpperCase() && i.status !== 'Rechazada');
  const wrongR = data && onlyDigits(data.nitR).slice(0, 9) !== COMPANY.nitRaw;
  const wrongE = data && onlyDigits(data.nitE).slice(0, 9) !== '830045221';
  const needPO = data && cfg.params.requirePO && !String(data.po).trim();
  const canSend = data && !dup && !wrongR && !wrongE && !needPO && data.number && data.total > 0;
  const loadSample = (patch = {}) => { setFiles({ xml: (patch.number || SAMPLE.number) + '.xml', pdf: (patch.number || SAMPLE.number) + '.pdf' }); setData({ ...SAMPLE, ...patch }); setStep(1); };
  useEffect(() => {
    const f = e => {
      if (e.detail === 'sample') loadSample({ po: '4500-1187' });
      if (e.detail === 'submit' && data && canSend) { const r = act.radicar(data); setDone(r); setStep(2); }
    };
    window.addEventListener('tour-radicar', f);
    return () => window.removeEventListener('tour-radicar', f);
  });
  if (block) return (<><PageHead title="Radicar factura" /><Alert severity="error" icon={<I n="block" />} action={<Button color="inherit" onClick={() => ctx.go('documentos')}>Ir a documentos</Button>}>{block}</Alert></>);
  return (
    <>
      <PageHead title="Radicar factura" sub={`Factura electrónica para ${cfg.companyName} (NIT ${COMPANY.nit}). Cargue el XML y su PDF; leemos los datos por usted.`} />
      <Stepper activeStep={done ? 3 : step} alternativeLabel sx={{ mb: 3 }}>
        {['Archivos', 'Revisar datos', 'Radicado'].map(l => <Step key={l}><StepLabel>{l}</StepLabel></Step>)}
      </Stepper>
      <Card sx={{ maxWidth: 860, mx: 'auto' }}><CardContent sx={{ p: { xs: 2, md: 3 } }}>
        {step === 0 && <Stack spacing={2.5}>
          <Box data-tour="rad-drop" sx={{ border: '2px dashed', borderColor: 'divider', borderRadius: 3, p: { xs: 3, md: 5 }, textAlign: 'center', bgcolor: 'action.hover' }}>
            <I n="cloud_upload" sx={{ fontSize: 48, color: ctx.theme.brand.strong }} />
            <Typography variant="h6" sx={{ mt: 1 }}>Seleccione el XML de la factura electrónica</Typography>
            <Typography variant="body2" color="text.secondary" sx={{ mb: 2 }}>XML UBL 2.1 validado por la DIAN + representación gráfica en PDF · máx. {cfg.params.maxFileMb} MB</Typography>
            <Stack direction="row" spacing={1} justifyContent="center" flexWrap="wrap" useFlexGap>
              <FileButton variant="contained" label="Seleccionar XML" accept=".xml" icon="code" onFile={f => {
                const r = new FileReader();
                r.onload = () => { const p = parseUBL(String(r.result)); if (!p) { ctx.notify('No pudimos leer el XML. Verifique que sea una factura electrónica UBL 2.1.', 'error'); return; } setFiles(x => ({ ...x, xml: f.name })); setData(p); setStep(1); };
                r.readAsText(f);
              }} />
              <Button variant="outlined" onClick={() => loadSample()}>Usar factura de ejemplo</Button>
            </Stack>
          </Box>
          <Box>
            <Typography variant="caption" color="text.secondary" component="div" sx={{ mb: 1 }}>Probar validaciones de la maqueta:</Typography>
            <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap>
              <Chip variant="outlined" label="Factura duplicada (RN-03)" onClick={() => loadSample({ number: 'LS-2291' })} />
              <Chip variant="outlined" label="NIT receptor incorrecto" onClick={() => loadSample({ nitR: '901555444' })} />
            </Stack>
          </Box>
        </Stack>}
        {step === 1 && data && <Stack spacing={2.5} data-tour="rad-form">
          <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap>
            <Chip icon={<I n="code" sx={{ fontSize: 18 }} />} label={files.xml || 'factura.xml'} color="primary" />

          <Grid container spacing={2}>
            <Grid item xs={12} sm={6}><TextField id="r-num" label="Número de factura" value={data.number} onChange={e => setData({ ...data, number: e.target.value })} error={!!dup} /></Grid>

            <Grid item xs={12} sm={6}><TextField id="r-nite" label="NIT emisor" value={data.nitE} InputProps={{ readOnly: true }} error={wrongE} /></Grid>
            <Grid item xs={12} sm={6}><TextField id="r-nitr" label="NIT receptor" value={data.nitR} InputProps={{ readOnly: true }} error={wrongR} /></Grid>
            <Grid item xs={12} sm={4}><TextField id="r-sub" label="Subtotal" value={fmt(data.subtotal)} InputProps={{ readOnly: true }} /></Grid>
            <Grid item xs={12} sm={4}><TextField id="r-iva" label="IVA" value={fmt(data.iva)} InputProps={{ readOnly: true }} /></Grid>
            <Grid item xs={12} sm={4}><TextField id="r-total" label="Total a pagar" value={fmt(data.total)} InputProps={{ readOnly: true }} /></Grid>
            <Grid item xs={12} sm={6}><TextField id="r-po" label={cfg.params.requirePO ? 'Orden de compra (obligatoria)' : 'Orden de compra (opcional)'} value={data.po} onChange={e => setData({ ...data, po: e.target.value })} error={needPO} placeholder="4500-0000" /></Grid>
            <Grid item xs={12} sm={6}><TextField id="r-cufe" label="CUFE" value={data.cufe} InputProps={{ readOnly: true }} /></Grid>
          </Grid>
          <Typography variant="caption" color="text.secondary">{cfg.texts.terms}</Typography>
          <Stack direction="row" spacing={1} justifyContent="flex-end">
            <Button onClick={() => { setStep(0); setData(null); setFiles({ xml: '', pdf: '' }); }}>Volver</Button>
            <Button variant="contained" startIcon={<I n="send" />} disabled={!canSend} onClick={() => { const r = act.radicar(data); setDone(r); setStep(2); }}>Radicar factura</Button>
          </Stack>
        </Stack>}
        {step === 2 && done && <Stack data-tour="rad-done" spacing={2} alignItems="center" sx={{ textAlign: 'center', py: 3 }}>
          <Avatar sx={{ width: 72, height: 72, bgcolor: ctx.theme.brand.secondary, color: darken(ctx.theme.brand.secondary, .7) }}><I n="task_alt" sx={{ fontSize: 40 }} /></Avatar>
          <Typography variant="h5">Factura radicada</Typography>
          <Typography color="text.secondary">Número de radicado</Typography>
          <Typography variant="h4" className="num" sx={{ fontFamily: 'ui-monospace, Consolas, monospace', fontSize: { xs: 24, md: 32 } }}>{done.rad}</Typography>
          <Typography variant="body2" color="text.secondary" sx={{ maxWidth: 480 }}>Le avisaremos por correo y en el portal cuando cambie de estado. También aparece ya en la bandeja de cuentas por pagar del portal empresa.</Typography>
          <Stack direction="row" spacing={1}><Button variant="outlined" onClick={() => ctx.go('misfacturas')}>Ver mis facturas</Button><Button variant="contained" onClick={() => { setStep(0); setData(null); setDone(null); }}>Radicar otra</Button></Stack>
        </Stack>}
      </CardContent></Card>
    </>
  );
}

          </MenuItem>

      <Box sx={{ flex: 1, display: 'flex', minHeight: 0 }}>
        {mdUp
          ? <Box component="nav" sx={{ flexShrink: 0, borderRight: 1, borderColor: 'divider', bgcolor: 'background.paper', overflowY: 'auto' }}>{nav}</Box>
          : <Drawer open={mob} onClose={() => setMob(false)} PaperProps={{ sx: { pt: 'env(safe-area-inset-top, 0px)', pl: 'env(safe-area-inset-left, 0px)' } }}>{nav}</Drawer>}
        <Box component="main" sx={{ flex: 1, minWidth: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
          <Box className="gutter" sx={{ py: { xs: 2.5, md: 4 }, width: '100%', maxWidth: 1320, mx: 'auto', flex: 1 }}>
            <Page key={portal + page} ctx={ctx} />
          </Box>
          <Box className="gutter" component="footer" sx={{ py: 2, borderTop: 1, borderColor: 'divider', display: 'flex', gap: 2, flexWrap: 'wrap', justifyContent: 'space-between' }}>
            <Typography variant="caption" color="text.secondary">{cfg.texts.footer}</Typography>
            <Typography variant="caption" color="text.secondary">Maqueta navegable · datos de ejemplo</Typography>
          </Box>
        </Box>
      </Box>
      {ctx.invId && <InvoiceDialog ctx={ctx} id={ctx.invId} onClose={() => ctx.openInv(null)} />}
    </Box>
  );
}

function TourPlayer({ tour, steps, onToggle, onNext, onRestart, onClose }) {
  const t = useTheme();
  const step = steps[tour.i];
  const [rect, setRect] = useState(null);
  useEffect(() => {
    setRect(null);
    const measure = scroll => {
      const el = document.querySelector('[data-tour="' + step.target + '"]');
      if (!el) { setRect(null); return; }
      if (scroll) { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { } }
      const r = el.getBoundingClientRect();
      if (!r.width) { setRect(null); return; }
      setRect({ x: r.left, y: r.top, w: r.width, h: r.height });
    };
    const a = setTimeout(() => measure(true), 450);
    const b = setTimeout(() => measure(false), 1150);
    const c = setTimeout(() => measure(false), 2300);
    const onR = () => measure(false);
    window.addEventListener('resize', onR);
    return () => { clearTimeout(a); clearTimeout(b); clearTimeout(c); window.removeEventListener('resize', onR); };
  }, [tour.i, tour.k]);
  const last = tour.i === steps.length - 1;
  const ring = t.brand.strong;
  const dark = t.palette.mode === 'dark';
  return (
    <>
      {rect && <Box aria-hidden="true" sx={{ position: 'fixed', zIndex: 1999, pointerEvents: 'none', left: rect.x - 6, top: rect.y - 6, width: rect.w + 12, height: rect.h + 12, borderRadius: 3, border: `3px solid ${ring}`, boxShadow: `0 0 0 8px ${alpha(ring, .18)}`, transition: 'all .45s ease' }} />}
      {rect && <Box aria-hidden="true" sx={{ position: 'fixed', zIndex: 2001, pointerEvents: 'none', left: rect.x + Math.min(rect.w / 2, 70), top: rect.y + Math.min(rect.h / 2, 36), transition: 'left .7s ease, top .7s ease', filter: 'drop-shadow(0 2px 3px rgba(0,0,0,.3))' }}>
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.6L9 19.5z" fill={dark ? '#FFFFFF' : '#1E1B2E'} stroke={dark ? '#1E1B2E' : '#FFFFFF'} strokeWidth="1.5" strokeLinejoin="round" /></svg>
      </Box>}
      <Card role="region" aria-label="Recorrido del camino feliz" sx={{ position: 'fixed', zIndex: 2000, left: 0, right: 0, mx: 'auto', bottom: 'calc(16px + env(safe-area-inset-bottom, 0px))', width: 'min(600px, calc(100% - 32px))', boxShadow: dark ? '0 12px 40px rgba(0,0,0,.6)' : '0 12px 40px rgba(30,20,70,.22)' }}>
        <CardContent sx={{ pb: '16px !important' }}>
          <Stack direction="row" spacing={1} alignItems="center" sx={{ mb: .75 }}>
            <Chip size="small" icon={<I n={step.p === 'empresa' ? 'apartment' : 'local_shipping'} sx={{ fontSize: 16 }} />} label={step.p === 'empresa' ? 'Portal empresa' : 'Portal proveedor'} sx={{ bgcolor: soft(step.p === 'empresa' ? '#D7B8F0' : '#9EDCC6', t), color: inkOn(step.p === 'empresa' ? '#D7B8F0' : '#9EDCC6', t) }} />
            <Typography variant="caption" color="text.secondary" className="num">Paso {tour.i + 1} de {steps.length}</Typography>
            <Box sx={{ flex: 1 }} />
            <IconButton size="small" aria-label="Cerrar recorrido" onClick={onClose}><I n="close" /></IconButton>
          </Stack>
          <Typography variant="h6" sx={{ lineHeight: 1.25 }}>{step.title}</Typography>
          <Typography variant="body2" color="text.secondary" sx={{ mt: .5, mb: 1.5 }}>{step.text}</Typography>
          <Box sx={{ display: 'flex', gap: .5, mb: 1.5 }}>
            {steps.map((s, i) => (
              <Box key={i} sx={{ flex: 1, height: 4, borderRadius: 2, bgcolor: i < tour.i ? ring : 'action.hover', overflow: 'hidden' }}>
                {i === tour.i && <Box key={tour.k} sx={{ height: '100%', bgcolor: ring, width: tour.playing ? 0 : '100%', opacity: tour.playing ? 1 : .5, animation: tour.playing ? `tourbar ${step.dur}ms linear forwards` : 'none' }} />}
              </Box>
            ))}
          </Box>
          <Stack direction="row" spacing={1} alignItems="center">
            <Button size="small" startIcon={<I n="replay" />} onClick={onRestart}>Reiniciar</Button>
            <Box sx={{ flex: 1 }} />
            <Button size="small" variant="outlined" startIcon={<I n={tour.playing ? 'pause' : 'play_arrow'} />} onClick={onToggle}>{tour.playing ? 'Pausa' : 'Reproducir'}</Button>
            <Button size="small" variant="contained" endIcon={<I n="skip_next" />} onClick={onNext} disabled={last}>Siguiente</Button>
          </Stack>
        </CardContent>
      </Card>
    </>
  );
}

function App() {
  const sysDark = useSysDark();
  const [cfg, setCfg] = useState(loadCfg);
  const [draft, setDraft] = useState(null);
  const active = draft || cfg;
  const theme = useMemo(() => buildTheme(active, sysDark), [active, sysDark]);
  const [portal, setPortalRaw] = useState('empresa');
  const [page, setPage] = useState('inicio');
  const [db, setDb] = useState(seed);
  const [toast, setToast] = useState(null);
  const [invId, setInvId] = useState(null);

  const notify = (msg, sev = 'success') => setToast({ msg, sev, k: Date.now() });
  const who = () => portal === 'empresa' ? ME_USER : SUP_USER + ' (Transportes La Sabana)';
  const audit = (action, entity, detail, actor) => setDb(d => ({ ...d, audit: [{ at: stamp(), actor: actor || who(), action, entity, detail }, ...d.audit] }));
  const pushNotif = (to, icon, text) => setDb(d => ({ ...d, notifs: [{ id: 'n' + Date.now() + Math.random(), to, at: '09 nov 2026', icon, text, read: false }, ...d.notifs] }));
  const supName = id => db.suppliers.find(s => s.id === id).name;

  const act = {
    transition(id, to, reason, extra = {}) {
      const inv = db.invoices.find(i => i.id === id);
      setDb(d => ({ ...d, invoices: d.invoices.map(i => i.id === id ? { ...i, ...extra, status: to, history: [...i.history, h(to, stamp(), ME_USER, reason)] } : i) }));
      audit(to === 'Aprobada' ? 'Aprobación' : to === 'Rechazada' ? 'Rechazo' : to === 'Requiere ajustes' ? 'Solicitud de ajustes' : 'Cambio de estado', 'Factura ' + inv.number, inv.status + ' → ' + to + (reason ? ' · ' + reason : ''));
      if (inv.sid === ME) pushNotif('proveedor', to === 'Aprobada' ? 'check_circle' : to === 'Rechazada' ? 'block' : to === 'Requiere ajustes' ? 'edit_note' : 'event', `Factura ${inv.number}: ${to}${reason ? ' · ' + reason : ''}`);
      notify(`Factura ${inv.number}: ${to}.${reason ? ' Se notificó al proveedor.' : ''}`);
    },
    pay(id, p) {
      const inv = db.invoices.find(i => i.id === id);
      setDb(d => ({ ...d,
        invoices: d.invoices.map(i => i.id === id ? { ...i, status: 'Pagada', history: [...i.history, h('Pagada', stamp(), 'Andrea Ruiz', `Fuente: ${p.source.toLowerCase()} · Ref. ${p.ref}`)] } : i),
        payments: [{ id: 'p' + Date.now(), iid: id, paidAt: p.date, amount: inv.total, ref: p.ref, source: p.source, by: ME_USER + ' (Administrador)', receipt: p.receipt }, ...d.payments] }));
      audit('Registro de pago', 'Factura ' + inv.number, `Fuente ${p.source.toLowerCase()} · ${p.ref} · ${fmt(inv.total)} · fecha ${fdate(p.date)}`);
      if (inv.sid === ME) pushNotif('proveedor', 'paid', `Pago registrado para ${inv.number}: ${fmt(inv.total)} (ref. ${p.ref}).`);
      notify(`Pago de ${inv.number} registrado.`);
    },
    comment(id, text) {
      const side = portal;
      setDb(d => ({ ...d, invoices: d.invoices.map(i => i.id === id ? { ...i, comments: [...i.comments, { by: side === 'empresa' ? ME_USER : SUP_USER, side, at: stamp(), text }] } : i) }));
      const inv = db.invoices.find(i => i.id === id);
      pushNotif(side === 'empresa' ? 'proveedor' : 'empresa', 'chat', `Nueva observación en ${inv.number}: “${text}”`);
    },
    newVersion(id, file) {
      const inv = db.invoices.find(i => i.id === id);
      setDb(d => ({ ...d, invoices: d.invoices.map(i => i.id === id ? { ...i, versions: i.versions + 1, status: 'En revisión', po: i.po || '4500-1187', history: [...i.history, h('En revisión', stamp(), SUP_USER, 'Nueva versión cargada: ' + file)] } : i) }));
      audit('Nueva versión de factura', 'Factura ' + inv.number, 'v' + (inv.versions + 1) + ' · ' + file);
      pushNotif('empresa', 'upload_file', `${supName(inv.sid)} cargó la corrección de ${inv.number}.`);
      notify('Corrección enviada. La factura vuelve a revisión.');
    },
    radicar(data) {
      const n = db.seq + 1;
      const id = 'i' + (100 + n);
      const rad = 'RAD-2026-' + String(4900 + n).padStart(6, '0');
      setDb(d => ({ ...d, seq: n, invoices: [{ id, rad, number: data.number, sid: ME, date: data.date, total: Number(data.total), status: 'Radicada', history: [h('Radicada', stamp(), SUP_USER)], versions: 1, comments: [], po: data.po }, ...d.invoices] }));
      audit('Radicación de factura', 'Factura ' + data.number, rad + ' · ' + fmt(data.total));
      pushNotif('empresa', 'receipt_long', `Transportes La Sabana radicó la factura ${data.number}.`);
      return { rad };
    },
    invite(f) {
      setDb(d => ({ ...d, suppliers: [...d.suppliers, { id: 's' + Date.now(), name: f.name, nit: f.nit, type: f.type, status: 'Invitado', docs: 'Sin documentos', email: f.email, city: '—', contact: '—' }] }));
      audit('Invitación de proveedor', f.name, f.nit + ' · ' + f.email);
      notify('Invitación enviada a ' + f.email + '. Vence en 7 días.');
    },
    supplierStatus(id, st, reason) {
      setDb(d => ({ ...d, suppliers: d.suppliers.map(s => s.id === id ? { ...s, status: st } : s) }));
      audit('Cambio de estado de proveedor', supName(id), st + (reason ? ' · ' + reason : ''));
      if (id === ME) pushNotif('proveedor', st === 'Bloqueado' ? 'block' : 'how_to_reg', `Su cuenta cambió a "${st}"${reason ? ': ' + reason : ''}.`);
      notify(supName(id) + ': ' + st + '.');
    },
    publishCert(f) {
      setDb(d => ({ ...d, certs: [{ id: 'c' + Date.now(), sid: f.sid, type: f.type, period: f.period, published: '2026-11-09', downloads: 0, status: 'Publicado', file: f.file, isNew: true }, ...d.certs] }));
      audit('Publicación de certificado', f.type + ' · ' + f.period, supName(f.sid) + ' · NIT validado');
      if (f.sid === ME) pushNotif('proveedor', 'workspace_premium', `Nuevo certificado ${f.type} (${f.period}) disponible.`);
      notify('Certificado publicado y proveedor notificado.');
    },
    batch(n) { audit('Publicación por lote', 'Retención en la fuente 2025', n + ' certificados emparejados por NIT'); notify(n + ' certificados publicados. Se notificó a cada proveedor.'); },
    unpublish(id, reason) {
      const c = db.certs.find(x => x.id === id);
      setDb(d => ({ ...d, certs: d.certs.map(x => x.id === id ? { ...x, status: 'Retirado' } : x) }));
      audit('Retiro de certificado', c.type + ' · ' + c.period, supName(c.sid) + ' · ' + reason);
      notify('Certificado retirado.');
    },
    download(id) {
      const c = db.certs.find(x => x.id === id);
      setDb(d => ({ ...d, certs: d.certs.map(x => x.id === id ? { ...x, downloads: x.downloads + 1, isNew: false } : x) }));
      audit('Descarga de certificado', c.type + ' · ' + c.period, c.file);
      notify('Descarga registrada. En el producto real se abre el PDF con un enlace temporal.', 'info');
    },
    uploadDoc(id, file) {
      const doc = db.docs.find(x => x.id === id);
      setDb(d => ({ ...d, docs: d.docs.map(x => x.id === id ? { ...x, version: x.version + 1, status: 'En revisión', file, reason: null, expires: x.expires ? '2027-11-09' : null } : x) }));
      audit('Carga de documento', doc.name, 'v' + (doc.version + 1) + ' · ' + file + ' · antivirus OK');
      pushNotif('empresa', 'folder_open', `Transportes La Sabana actualizó: ${doc.name}.`);
      notify('Documento cargado. Quedó en revisión.');
    },
    toggleUser(id) {
      const u = db.users.find(x => x.id === id);
      setDb(d => ({ ...d, users: d.users.map(x => x.id === id ? { ...x, active: !x.active } : x) }));
      audit(u.active ? 'Desactivación de usuario' : 'Activación de usuario', u.name, u.email);
    },
    addUser(u) {
      setDb(d => ({ ...d, users: [...d.users, { id: 'u' + Date.now(), name: u.name, email: u.email, roles: u.roles, active: true }] }));
      audit('Invitación de usuario', u.name, u.roles.join(', '));
      notify('Invitación enviada a ' + u.email + '.');
    },
    read(id) { setDb(d => ({ ...d, notifs: d.notifs.map(n => n.id === id ? { ...n, read: true } : n) })); },
    readAll(to) { setDb(d => ({ ...d, notifs: d.notifs.map(n => n.to === to ? { ...n, read: true } : n) })); }
  };

  const saveDraft = () => {
    if (!draft) return;
    const changed = Object.keys(draft).filter(k => JSON.stringify(draft[k]) !== JSON.stringify(cfg[k]));
    setCfg(draft); saveCfg(draft); setDraft(null);
    audit('Cambio de configuración', 'Marca y parámetros', 'Campos: ' + (changed.join(', ') || 'ninguno'));
    notify('Configuración guardada. Todos los usuarios y proveedores la verán al ingresar.');
  };
  const resetCfg = () => { setCfg(DEFAULT_CFG); saveCfg(DEFAULT_CFG); setDraft(null); audit('Restablecer configuración', 'Marca y parámetros', 'Valores predeterminados'); notify('Configuración restablecida.'); };
  const setPortal = p => { setPortalRaw(p); setPage('inicio'); setInvId(null); };
  const go = p => setPage(p);

  const [tour, setTour] = useState(null);
  const dbRef = useRef(db); dbRef.current = db;
  const actRef = useRef(act); actRef.current = act;
  const cfgRef = useRef(cfg); cfgRef.current = cfg;
  const ranRef = useRef(-1);
  const steps = useMemo(() => makeSteps({
    db: () => dbRef.current, act: () => actRef.current, cfg: () => cfgRef.current,
    reset: () => { setDb(seed()); setDraft(null); setInvId(null); },
    portal: p => { setPortalRaw(p); setPage('inicio'); setInvId(null); },
    go: p => setPage(p), draft: setDraft, open: setInvId,
    radicar: a => window.dispatchEvent(new CustomEvent('tour-radicar', { detail: a }))
  }), []);
  useEffect(() => {
    if (!tour) return;
    if (ranRef.current !== tour.i) {
      ranRef.current = tour.i;
      try { steps[tour.i].run(); } catch (e) { console.warn('Paso del recorrido', e); }
    }
    if (!tour.playing) return;
    const id = setTimeout(() => setTour(x => x && (x.i < steps.length - 1 ? { ...x, i: x.i + 1, k: Date.now() } : { ...x, playing: false })), steps[tour.i].dur);
    return () => clearTimeout(id);
  }, [tour]);
  const startTour = () => { ranRef.current = -1; setTour({ i: 0, playing: true, k: Date.now() }); };
  useEffect(() => { try { if (location.hash === '#recorrido') startTour(); } catch (e) { } }, []);
  useEffect(() => {
    const PROV = ['radicar', 'misfacturas', 'documentos', 'miscert', 'mispagos', 'perfil', 'notif', 'portal-proveedor'];
    const EMP = ['facturas', 'pagos', 'certificados', 'proveedores', 'auditoria', 'config', 'usuarios', 'portal-empresa'];
    const apply = () => {
      let hs = '';
      try { hs = location.hash.slice(1); } catch (e) { }
      const p = PROV.includes(hs) ? 'proveedor' : EMP.includes(hs) ? 'empresa' : null;
      if (!p) return;
      setPortalRaw(p); setPage(hs.startsWith('portal-') ? 'inicio' : hs); setInvId(null);
    };
    apply();
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);

  const ctx = { db, setDb, cfg: active, savedCfg: cfg, draft, setDraft, saveDraft, resetCfg, portal, setPortal, page, go, act, notify, audit, theme, invId, openInv: setInvId, tour, startTour };

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      <Shell ctx={ctx} />
      {tour && <TourPlayer tour={tour} steps={steps}
        onToggle={() => setTour(x => ({ ...x, playing: !x.playing, k: Date.now() }))}
        onNext={() => setTour(x => ({ ...x, i: Math.min(x.i + 1, steps.length - 1), k: Date.now() }))}
        onRestart={startTour}
        onClose={() => { setTour(null); setDraft(null); }} />}
      <Snackbar key={toast && toast.k} open={!!toast} autoHideDuration={4200} onClose={() => setToast(null)} anchorOrigin={{ vertical: tour ? 'top' : 'bottom', horizontal: 'center' }} sx={{ mb: 'env(safe-area-inset-bottom, 0px)' }}>
        {toast ? <Alert severity={toast.sev} variant="filled" onClose={() => setToast(null)} sx={{ fontWeight: 700 }}>{toast.msg}</Alert> : <span />}
      </Snackbar>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
